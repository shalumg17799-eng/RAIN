# Agent spec for the scenario-designer skill agent (PRD design stage 4b).
name: scenario-designer
version: 0.2.0
purpose: design
capabilities:
  pipeline: prd_design
  stage: scenario
  intents: [design_scenarios]
  data_sources: [requirements_ir, entity_model, synthetic_db_state]
  artifacts: [scenario]
prompt: skills/scenario-designer/SKILL.md
output_key: scenario
output_schema: scenario-designer
max_iterations: 6
max_repairs: 2
confidence_threshold: 0.6
token_budget: 120000
timeout_ms: 1200000
tools:
- read_entity_model
- read_synthetic_db_state
- validate_scenarios
instruction: |
  Design scenarios for the Requirements IR and entity model in the first user message, against the
  SYNTHETIC database state shown there (generated from the entity model; this pipeline never reads
  or writes any real database, and never executes your SQL -- every statement is a proposal). The
  finish result is one object with a scenarios array in the SKILL's shape: id, event_id,
  description, statements (purpose + sql, only INSERT/UPDATE/DELETE/ALTER TABLE ADD COLUMN IF NOT
  EXISTS, absolute timestamps from the anchor date, only entity-model tables), and checks (one-row
  single-numeric-column SELECTs with expected values and tolerances for the committed figures).
  Say explicitly in coverage notes when a committed figure cannot be derived.

  Everything you need is in the first message; submit with finish directly -- validation runs
  there automatically and specific errors come back for repair. Keep descriptions and purposes
  terse; the finished scenarios must fit the output budget.
