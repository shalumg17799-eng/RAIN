# The Insights Server agent: one graph, one skill per stage, labels map to steps, no logic here.
# Validated against the skill registry before it is compiled (python -m insights.cli ... / S10 API).
name: insights-agent
version: 0.1.0
description: Route, retrieve the schema sliver, generate SQL, execute under the caller's identity, assess, compose; refine the sliver or the query at most max_refines times.

steps:
  - id: route
    skill: skill-router
    input:
      query: $.input.query
      context: $.input.context
    route:
      on: $.steps.route.output.label
      to:
        data_query: sliver
        metadata_question: metadata_answer
        out_of_scope: compose
        needs_clarification: compose
        denied: compose

  - id: metadata_answer
    skill: metadata-answerer
    input:
      query: $.input.query
      context: $.input.context
    route:
      on: $.steps.metadata_answer.output.label
      to:
        answered: compose
        empty: compose

  - id: sliver
    skill: schema-sliver
    input:
      query: $.input.query
      path_preference: $.steps.route.output.path_preference
      context: $.input.context
      attempt: $.refine.attempt
      critique: $.refine.critique
    route:
      on: $.steps.sliver.output.label
      to:
        ok: generate
        empty: compose

  - id: generate
    skill: query-generator
    input:
      query: $.input.query
      sliver: $.steps.sliver.output.sliver
      context: $.input.context
      intent: $.steps.route.output.intent
      concepts: $.steps.sliver.output.concepts
      critique: $.refine.critique
      attempt: $.refine.attempt
    route:
      on: $.steps.generate.output.label
      to:
        generated: execute
        unusable: compose

  - id: execute
    skill: governed-executor
    input:
      sql: $.steps.generate.output.sql
      sliver: $.steps.sliver.output.sliver
    route:
      on: $.steps.execute.output.label
      to:
        ok: assess
        error: assess
        policy_denied: compose
        access_denied: compose
        timeout: compose

  - id: assess
    skill: result-assessor
    input:
      question: $.input.query
      execution: $.steps.execute.output
      sliver: $.steps.sliver.output.sliver
      generation: $.steps.generate.output
      unmatched: $.steps.sliver.output.unmatched
      attempt: $.refine.attempt
    route:
      on: $.steps.assess.output.label
      to:
        answer: compose
        refine_sliver: sliver
        refine_query: generate
        escalate: compose

  - id: compose
    skill: answer-composer
    input:
      question: $.input.query
      steps: $.steps
      refine: $.refine

output:
  answer: $.steps.compose.output

limits:
  max_refines: 2
  max_tokens: 20000
  deadline_ms: 20000
