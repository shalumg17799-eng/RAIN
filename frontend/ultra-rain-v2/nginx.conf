# Ultra for RAIN (the new UI): SPA + reverse proxy to the backend service (same as frontend/rain-app).
# proxy_buffering OFF where a stream could flow (the backend serves SSE on some /api routes).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve the backend per request through Docker's DNS, not once at startup: the frontend
    # starts (and shows "could not load its data from the backend") while the backend is down,
    # and follows a recreated backend container without a restart.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://backend:8000;

    location /api/ {
        proxy_pass $backend;
        # Fail fast when the backend is down: the app reports it instead of waiting 60 s.
        proxy_connect_timeout 5s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /health {
        proxy_pass $backend;
        proxy_connect_timeout 5s;
    }

    location / {
        try_files $uri /index.html;
    }
}
