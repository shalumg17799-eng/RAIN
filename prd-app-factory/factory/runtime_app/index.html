<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Loading…</title>
<style>
  :root { --bg:#f6f8f9; --card:#fff; --ink:#15232d; --muted:#5b6b77; --line:#dbe3e8; --accent:#1d455f;
          --crit:#b42318; --warn:#b5651d; --info:#2f6f9f; --ok:#2f7d4f; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f171d; --card:#16222b; --ink:#e4ecf0; --muted:#9aaab5;
          --line:#2a3a46; --accent:#8fc2dd; --crit:#f2867c; --warn:#e3a35e; --info:#7fb6e0; --ok:#7cc79a; color-scheme:dark } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Segoe UI", Arial, sans-serif }
  header { padding:20px max(16px, 4vw); border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:12px 24px; align-items:end; justify-content:space-between }
  h1 { margin:0; font-size:24px } .sub { color:var(--muted); margin:2px 0 0 }
  main { padding:24px max(16px, 4vw); display:grid; gap:28px; max-width:1200px; margin:0 auto }
  select, input, button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink) }
  button { background:var(--accent); color:var(--bg); border:0; cursor:pointer } button:disabled { opacity:.6 }
  h2 { font-size:17px; margin:0 0 10px }
  .tiles { display:grid; grid-template-columns:repeat(auto-fill, minmax(210px, 1fr)); gap:12px }
  .tile, .signal, .answer { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px }
  .tile .v { font-size:28px; font-weight:600; margin:4px 0 } .tile .l { color:var(--muted); font-size:13px }
  .badge { font:11px/1.6 Consolas, monospace; padding:0 6px; border-radius:999px; border:1px solid currentColor }
  .live { color:var(--ok) } .static { color:var(--warn) } .error, .missing { color:var(--crit) }
  .signals { display:grid; gap:12px }
  .signal h3 { margin:0 0 4px; font-size:16px } .sev-critical { color:var(--crit) } .sev-warning { color:var(--warn) } .sev-info { color:var(--info) }
  .subs { display:flex; flex-wrap:wrap; gap:8px 18px; margin-top:8px; font-size:13px; color:var(--muted) }
  .subs b { color:var(--ink) }
  .ask { display:flex; gap:8px; flex-wrap:wrap } .ask input { flex:1 1 320px }
  .chips { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px }
  .chips button { background:transparent; color:var(--accent); border:1px solid var(--line); font-size:13px }
  pre { white-space:pre-wrap; font:12px/1.5 Consolas, monospace; color:var(--muted); margin:8px 0 0 }
  table { border-collapse:collapse; margin-top:8px; font-size:13px } td, th { border:1px solid var(--line); padding:4px 8px }
  footer { color:var(--muted); font-size:12px; text-align:center; padding:20px }
</style>
</head>
<body>
<header>
  <div><h1 id="title">Loading…</h1><p class="sub" id="subtitle"></p></div>
  <label>Persona <select id="persona"></select></label>
</header>
<main>
  <p id="intro" class="sub"></p>
  <section><h2>Key figures</h2><div class="tiles" id="tiles"></div></section>
  <section><h2>Priority signals</h2><div class="signals" id="signals"></div></section>
  <section id="ask-section"><h2>Ask a question</h2>
    <form class="ask" id="ask"><input id="q" placeholder="Ask about this data in plain English"><button id="go">Ask</button></form>
    <div class="chips" id="chips"></div>
    <div id="answer"></div>
  </section>
</main>
<footer>Generated by the PRD-to-App Factory · every figure is computed live unless marked otherwise</footer>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let info;
async function get(url, opts) { const r = await fetch(url, opts); if (!r.ok) throw new Error(await r.text()); return r.json(); }
async function load() {
  info = await get("/api/app");
  document.title = info.title; $("title").textContent = info.title; $("subtitle").textContent = info.subtitle || info.description;
  $("persona").innerHTML = info.personas.map((p) => `<option value="${p.id}">${esc(p.label)}</option>`).join("");
  $("ask-section").hidden = !info.ask_enabled;
  $("persona").onchange = render; render();
}
async function render() {
  const d = await get(`/api/personas/${$("persona").value}/dashboard`);
  $("intro").textContent = d.intro;
  $("tiles").innerHTML = d.tiles.map((t) => `<div class="tile" title="${esc(t.definition)}">
    <div class="l">${esc(t.label)}</div><div class="v">${esc(t.value)}</div>
    <div class="l">PRD: ${esc(t.prd)}${t.prior ? " · " + esc(t.prior) : ""} <span class="badge ${t.source}">${t.source}</span></div></div>`).join("");
  $("signals").innerHTML = d.signals.map((s) => `<div class="signal"><h3><span class="sev-${s.severity}">${s.severity.toUpperCase()}</span> · ${esc(s.title)}
    ${s.headline ? ` · <span>${esc(s.headline)}</span> <span class="badge ${s.source}">${s.source}</span>` : ""}</h3>
    <div>${esc(s.description)}</div><div class="subs">${s.sub_figures.map((f) => `<span>${esc(f.name)}: <b>${esc(f.value)}</b> <span class="badge ${f.source}">${f.source}</span></span>`).join("")}</div></div>`).join("");
  $("chips").innerHTML = d.questions.map((q) => `<button type="button">${esc(q)}</button>`).join("");
  [...$("chips").children].forEach((b) => b.onclick = () => { $("q").value = b.textContent; ask(); });
  $("answer").innerHTML = "";
}
async function ask(ev) {
  ev?.preventDefault(); const q = $("q").value.trim(); if (!q) return;
  $("go").disabled = true; $("answer").innerHTML = `<div class="answer">Working…</div>`;
  try {
    const r = await get("/api/ask", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({persona:$("persona").value, question:q})});
    const rows = r.data?.rows?.slice(0, 20) || [], cols = r.data?.columns?.map((c) => c.name) || [];
    $("answer").innerHTML = `<div class="answer"><b>${esc(r.status)}</b> · ${esc(r.narrative || r.reason || "")}
      ${rows.length ? `<table><tr>${cols.map((c) => `<th>${esc(c)}</th>`).join("")}</tr>${rows.map((row) => `<tr>${row.map((v) => `<td>${esc(v)}</td>`).join("")}</tr>`).join("")}</table>` : ""}
      ${r.sql ? `<pre>${esc(r.sql)}</pre>` : ""}</div>`;
  } catch (e) { $("answer").innerHTML = `<div class="answer error">${esc(e.message)}</div>`; }
  $("go").disabled = false;
}
$("ask").onsubmit = ask;
load().catch((e) => { $("title").textContent = "Could not load the app: " + e.message; });
</script>
</body>
</html>
