- id: sarah_diabetes_gap.transport_barrier
  sql: SELECT COUNT(DISTINCT pc.patient_id) FROM patient_conditions pc JOIN sdoh_screenings
    s ON s.patient_id = pc.patient_id AND s.transport_barrier WHERE pc.condition =
    'diabetes' AND pc.assigned_provider_id IN (SELECT provider_id FROM providers WHERE
    reassigned_to_provider_id IS NOT NULL) AND NOT EXISTS (SELECT 1 FROM lab_results
    l WHERE l.patient_id = pc.patient_id AND l.test_code = 'a1c' AND l.result_date
    >= (SELECT MAX(detected_date) FROM data_sources) - INTERVAL '9 months')
  value: 18.0
  computed_at: '2026-10-20T23:12:47+00:00'
  note: Of the 41 (diabetes, no recent A1c, assigned to a reassigned provider), those
    with an SDOH transportation-barrier flag.
- id: sarah_diabetes_gap.visit_rate_drop_pct
  sql: WITH c AS (SELECT MAX(ob_suspended_date) AS d FROM facilities), coh AS (SELECT
    DISTINCT pc.patient_id FROM patient_conditions pc WHERE pc.condition = 'diabetes'
    AND pc.assigned_provider_id IN (SELECT provider_id FROM providers WHERE reassigned_to_provider_id
    IS NOT NULL)), v AS (SELECT COUNT(*) FILTER (WHERE e.encounter_date >= c.d AND
    e.encounter_date < c.d + 90) AS post, COUNT(*) FILTER (WHERE e.encounter_date
    >= c.d - 90 AND e.encounter_date < c.d) AS pre FROM encounters e, c WHERE e.encounter_type
    IN ('in_person','telehealth') AND e.patient_id IN (SELECT patient_id FROM coh))
    SELECT ROUND(100.0 * (pre - post) / NULLIF(pre, 0), 1) FROM v
  value: null
  computed_at: '2026-10-20T23:12:46+00:00'
  note: Percent drop in in-person and telehealth encounters for the reassigned-provider
    diabetes cohort, 90 days after the closure vs 90 days before. In v1, encounters
    hold only 'ed' and 'lab' types, so this returns NULL. It needs in-person and telehealth
    encounter history.
- id: sarah_diabetes_no_a1c
