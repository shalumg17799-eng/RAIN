- id: maria_no_scheduled_transport
  sql: SELECT COUNT(DISTINCT pr.patient_id) FROM pregnancies pr WHERE pr.status =
    'active' AND NOT EXISTS (SELECT 1 FROM transport_requests t WHERE t.patient_id
    = pr.patient_id AND t.mode = 'nemt' AND t.status IN ('scheduled','completed')
    AND t.service_date >= (SELECT MAX(detected_date) FROM data_sources))
  value: 22.0
  computed_at: '2026-10-20T23:11:47+00:00'
  note: Active-pregnancy patients with no upcoming scheduled NEMT trip (service_date
    on or after the data as-of date 2026-05-15). With no appointments table, every
    active pregnancy is assumed to have upcoming prenatal appointments.
- id: maria_prenatal_completion
