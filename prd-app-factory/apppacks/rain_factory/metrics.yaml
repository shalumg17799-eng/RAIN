    gestational diabetes, prior preterm birth).
- id: maria_elevated_risk_cohort.missed_prenatal_visit
  sql: SELECT COUNT(DISTINCT patient_id) FROM pregnancies WHERE status = 'active'
    AND distance_to_delivery_miles > 100 AND trimester = 3 AND last_prenatal_visit_date
    < (SELECT MAX(detected_date) FROM data_sources) - 30
  value: 6.0
  computed_at: '2026-10-20T23:11:31+00:00'
  note: 'Proxy: there is no appointments table, so a missed visit cannot be observed
    directly. A third-trimester cohort patient counts as having missed a visit when
    the last prenatal visit is more than 30 days before the data as-of date (MAX(data_sources.detected_date)
    = 2026-05-15). 30 days is the longest standard prenatal visit interval (monthly),
    so a longer gap means at least one visit was missed. The 30-day threshold is not
    in the PRD.'
- id: maria_elevated_risk_cohort.third_trimester
