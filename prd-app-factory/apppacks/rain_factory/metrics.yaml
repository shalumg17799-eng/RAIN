    p ON p.patient_id = f.patient_id WHERE f.is_maintenance AND p.chronic_program
    GROUP BY f.patient_id HAVING MAX(f.fill_date) < (SELECT MAX(detected_date) FROM
    data_sources) - 30) g
  value: 94.0
  computed_at: '2026-10-20T23:12:47+00:00'
  note: Chronic-program patients whose latest maintenance-medication fill is more
    than 30 days before the as-of date (house 'medication gap' definition). Patients
    with no fill history at all are not counted.
- id: sarah_sdoh_transport_barrier
