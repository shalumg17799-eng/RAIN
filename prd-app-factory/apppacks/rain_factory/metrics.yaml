    AND distance_to_delivery_miles > 100 AND trimester = 3
  value: 14.0
  computed_at: '2026-10-20T23:11:31+00:00'
  note: Elevated-risk pregnancy cohort (>100 mi) members currently in trimester 3.
- id: maria_elevated_risk_pregnancies
  sql: SELECT COUNT(DISTINCT patient_id) FROM pregnancies WHERE status = 'active'
    AND distance_to_delivery_miles > 100
  value: 38.0
  computed_at: '2026-10-20T23:11:31+00:00'
  note: 'House definition of an ''elevated-risk pregnancy'' (no local delivery access):
    active pregnancy whose home is more than 100 miles from the nearest delivering
