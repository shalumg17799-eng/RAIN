metrics:
- id: maria_active_pregnancies
  sql: SELECT COUNT(DISTINCT patient_id) FROM pregnancies WHERE status = 'active'
  value: 126.0
  computed_at: '2026-10-20T23:11:31+00:00'
  note: 'Distinct patients with an active pregnancy episode in the maternal registry
    (the registry is the service-area registry). Not filtered by patients.county:
    county is unreliable (every ZIP has patients in all three counties, DQ warning).
    Filtering to Humboldt/Pershing on patients.county would give 83.'
- id: maria_avg_distance_delivery
  sql: SELECT ROUND(AVG(distance_to_delivery_miles), 1) FROM pregnancies WHERE status
    = 'active'
  value: 45.7
  computed_at: '2026-10-20T23:11:47+00:00'
  note: Average home-to-nearest-delivering-hospital distance over all active pregnancies
    = 45.7 mi. The PRD's 115 is the distance for the 38 patients whose nearest delivering
    hospital is now Reno (FAC-003, all exactly 115 mi), i.e. the facility distance
    after the closure, not a population average. Left as a mismatch for review.
- id: maria_ed_deliveries_bba
  sql: SELECT COUNT(*) FROM encounters WHERE source_encounter_type = 'ED_delivery_or_BBA'
    AND encounter_date > (SELECT MAX(detected_date) FROM data_sources) - 60 AND encounter_date
    <= (SELECT MAX(detected_date) FROM data_sources)
  value: 3.0
  computed_at: '2026-10-20T23:12:03+00:00'
  note: ED-delivery / birth-before-arrival encounters (dx O80/O81) in the last 60
    days to the data as-of date 2026-05-15, following the demo wording 'in the last
    60 days'. A closure-anchored window (Mar 1 to Apr 29) would give 2. These encounters
    are also flagged avoidable_ed in the source, so avoidable-ED metrics exclude them.
- id: maria_ed_delivery_risk
  sql: SELECT COUNT(*) FROM encounters WHERE source_encounter_type = 'ED_delivery_or_BBA'
    AND encounter_date > (SELECT MAX(detected_date) FROM data_sources) - 60 AND encounter_date
    <= (SELECT MAX(detected_date) FROM data_sources)
  value: 3.0
  computed_at: '2026-10-20T23:12:03+00:00'
  note: Same definition as maria_ed_deliveries_bba.
- id: maria_ed_delivery_risk.births_before_arrival
  sql: SELECT COUNT(*) FROM pregnancies WHERE delivery_setting = 'before_arrival'
    AND delivery_date > (SELECT MAX(detected_date) FROM data_sources) - 60 AND delivery_date
    <= (SELECT MAX(detected_date) FROM data_sources)
  value: 0.0
  computed_at: '2026-10-20T23:12:03+00:00'
  note: Written from the contract column pregnancies.delivery_setting. It is empty
    in v1, and the source encounter type 'ED_delivery_or_BBA' combines ED deliveries
    and births before arrival, so the 2 + 1 split cannot be computed. Returns 0 until
    delivery_setting is filled.
