- id: maria_elevated_risk_cohort.high_risk_dx
  sql: SELECT COUNT(DISTINCT patient_id) FROM pregnancies WHERE status = 'active'
    AND distance_to_delivery_miles > 100 AND high_risk_dx IN ('preeclampsia','gestational_diabetes','prior_preterm_birth')
  value: 9.0
