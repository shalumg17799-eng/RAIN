  value: 61.0
  computed_at: '2026-10-20T23:11:46+00:00'
  note: Read from the supplied trend table (src_metric_trend, 'Service-area prenatal
    completion, pre- vs post-closure', after_date 2026-05-15). There is no appointments
    table, so completed/scheduled prenatal visits cannot be computed row by row. Prior
