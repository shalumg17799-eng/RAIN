    = 'diabetes' AND NOT EXISTS (SELECT 1 FROM lab_results l WHERE l.patient_id =
    pc.patient_id AND l.test_code = 'a1c' AND l.result_date >= (SELECT MAX(detected_date)
    FROM data_sources) - INTERVAL '9 months')
  value: 112.0
  computed_at: '2026-10-20T23:12:46+00:00'
  note: Diabetes enrollees with no A1c result in the 9 months before the as-of date
    2026-05-15.
- id: sarah_elevated_risk_cohort
  sql: SELECT COUNT(DISTINCT p.patient_id) FROM patients p WHERE p.elevated_risk =
    true AND p.patient_id IN (SELECT patient_id FROM patient_conditions)
  value: 0.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: 'House definition of an ''elevated-risk patient'': patients.elevated_risk
