- id: sarah_chf_copd_cluster
  sql: WITH asof AS (SELECT MAX(detected_date) AS d FROM data_sources), w AS (SELECT
    r.patient_id FROM rpm_readings r, asof WHERE r.received_at IS NOT NULL AND r.metric
    IN ('weight','spo2') AND r.expected_at >= asof.d - 13 AND r.expected_at < asof.d
    + 1 GROUP BY r.patient_id, r.metric HAVING (r.metric = 'weight' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) > 0) OR (r.metric = 'spo2' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) < 0)) SELECT COUNT(DISTINCT patient_id)
    FROM w
  value: 17.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: Same definition as sarah_chf_copd_worsening.
- id: sarah_chf_copd_cluster.lost_provider
  sql: WITH asof AS (SELECT MAX(detected_date) AS d FROM data_sources), w AS (SELECT
    r.patient_id FROM rpm_readings r, asof WHERE r.received_at IS NOT NULL AND r.metric
    IN ('weight','spo2') AND r.expected_at >= asof.d - 13 AND r.expected_at < asof.d
    + 1 GROUP BY r.patient_id, r.metric HAVING (r.metric = 'weight' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) > 0) OR (r.metric = 'spo2' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) < 0)), g AS (SELECT f.patient_id FROM
    pharmacy_fills f, asof WHERE f.is_maintenance GROUP BY f.patient_id, asof.d HAVING
    MAX(f.fill_date) < asof.d - 30), lc AS (SELECT DISTINCT patient_id FROM patient_conditions
    WHERE assigned_provider_id IN (SELECT provider_id FROM providers WHERE reassigned_to_provider_id
    IS NOT NULL)) SELECT COUNT(DISTINCT w.patient_id) FROM w WHERE w.patient_id IN
    (SELECT patient_id FROM g) AND w.patient_id IN (SELECT patient_id FROM lc)
  value: 5.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: 'Of the worsening and medication-gap patients, those who lost provider continuity.
    House definition of ''lost provider continuity'': the patient''s chronic-care
    assigned provider is one of the providers whose panel was reassigned after the
    closure (providers.reassigned_to_provider_id not null: PRV-001/002, deactivated
    2026-03-01). patients.lost_provider_continuity is empty in v1.'
- id: sarah_chf_copd_cluster.med_gap_30d
  sql: WITH asof AS (SELECT MAX(detected_date) AS d FROM data_sources), w AS (SELECT
    r.patient_id FROM rpm_readings r, asof WHERE r.received_at IS NOT NULL AND r.metric
    IN ('weight','spo2') AND r.expected_at >= asof.d - 13 AND r.expected_at < asof.d
    + 1 GROUP BY r.patient_id, r.metric HAVING (r.metric = 'weight' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) > 0) OR (r.metric = 'spo2' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) < 0)), g AS (SELECT f.patient_id FROM
    pharmacy_fills f, asof WHERE f.is_maintenance GROUP BY f.patient_id, asof.d HAVING
    MAX(f.fill_date) < asof.d - 30) SELECT COUNT(DISTINCT w.patient_id) FROM w WHERE
    w.patient_id IN (SELECT patient_id FROM g)
  value: 9.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: 'Of the worsening CHF/COPD patients, those with a medication gap. House definition
    of ''medication gap'': the patient''s latest maintenance-medication fill is more
    than 30 days before the as-of date.'
- id: sarah_chf_copd_cluster.med_gap_threshold_days
  sql: ''
  value: 30.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: PRD parameter (30-day medication gap threshold), not a measured value.
- id: sarah_chf_copd_cluster.window_days
  sql: ''
  value: 14.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: PRD parameter (14-day RPM trend window), not a measured value.
- id: sarah_chf_copd_worsening
  sql: WITH asof AS (SELECT MAX(detected_date) AS d FROM data_sources), w AS (SELECT
    r.patient_id FROM rpm_readings r, asof WHERE r.received_at IS NOT NULL AND r.metric
    IN ('weight','spo2') AND r.expected_at >= asof.d - 13 AND r.expected_at < asof.d
    + 1 GROUP BY r.patient_id, r.metric HAVING (r.metric = 'weight' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) > 0) OR (r.metric = 'spo2' AND regr_slope(r.value,
    extract(epoch FROM r.expected_at)/86400) < 0)) SELECT COUNT(DISTINCT patient_id)
    FROM w
  value: 17.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: 'House definition of ''worsening RPM'': in the last 14 days to the as-of date
    2026-05-15, the least-squares slope of received readings is rising for weight
    (CHF) or falling for SpO2 (COPD). Missing readings are excluded (they still carry
    values, DQ warning). The rpm_trend_assessments table has no source, so trends
    are computed from readings.'
- id: sarah_chronic_monitored
  sql: SELECT COUNT(DISTINCT patient_id) FROM patient_conditions
  value: 1340.0
  computed_at: '2026-10-20T23:12:26+00:00'
  note: Distinct patients enrolled in the chronic-condition care-coordination program
    (patient_conditions = ChronicConditionEnrollment). Includes 971 'chronic-other'
