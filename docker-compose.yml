# The whole RAIN stack: governed Postgres (seeded with data + RLS), Neo4j KAG (seeded from the
# repo's cypher), the FastAPI backend (insights platform + legacy endpoints), and the nginx-served
# frontend. Bring it up:
#
#   docker compose up -d --build
#
# Prerequisites (all local files, never baked into images):
#   rain-api/.env                 host secrets (ANTHROPIC_API_KEY, PG_*, NEO4J_*) - mounted
#   apps/keys.local.yaml          the /api/v2 bearer keys - mounted
#   deploy/initdb/*.sql           regenerate from a live DB with deploy/scripts/make_pg_seed.ps1
#   frontend/rain-app/.env.local  VITE_RAIN_KEY_* persona tokens - baked at frontend BUILD time
#
# URLs: frontend http://localhost:8181 - backend http://localhost:8000 - neo4j http://localhost:17474
# Postgres is on host port 55433 (the container seeds itself on FIRST start; reset: compose down -v).
name: rain

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_ADMIN_PASSWORD:-root}
      POSTGRES_DB: rain
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "${PG_HOST_PORT:-55433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rain"]
      interval: 5s
      timeout: 5s
      retries: 30

  neo4j:
    image: neo4j:5
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4jdata:/data
    ports:
      - "${NEO4J_HTTP_PORT:-17474}:7474"
      - "${NEO4J_BOLT_PORT:-17687}:7687"
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -a bolt://localhost:7687 -u neo4j -p ${NEO4J_PASSWORD:-password} 'RETURN 1' > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 40s

  neo4j-seed:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    entrypoint: ["python", "/app/deploy/scripts/seed_neo4j.py"]
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      NEO4J_DATABASE: neo4j
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: deploy/backend/Dockerfile
    restart: unless-stopped
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_DATABASE: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
    volumes:
      - ./rain-api/.env:/secrets/rain.env:ro
      - ./apps/keys.local.yaml:/app/apps/keys.local.yaml:ro
      - ./artifacts:/app/artifacts
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend/rain-app
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8181}:80"
    depends_on:
      - backend

volumes:
  pgdata:
  neo4jdata:
